<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Staff | Aurass Barbershop</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #171a21;
            --accent-gold: #c5a059;
            --accent-gold-hover: #d4af66;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #262a36;
            --danger-red: #ef4444;
            --wa-green: #25d366;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 30px 20px;
        }

        .header-container {
            max-width: 1100px;
            margin: 0 auto 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        .brand-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: var(--accent-gold);
            letter-spacing: 1px;
        }

        .btn-logout {
            padding: 10px 18px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger-red);
            color: var(--danger-red);
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-logout:hover { background: var(--danger-red); color: #fff; }

        .dashboard-container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .table-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-gold);
            padding: 14px;
            border-bottom: 2px solid var(--border-color);
        }

        td {
            padding: 16px 14px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
        }

        tr:last-child td { border-bottom: none; }

        .badge-service {
            background: rgba(197, 160, 89, 0.1);
            color: var(--accent-gold);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid rgba(197, 160, 89, 0.3);
            display: inline-block;
        }

        .action-btns {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-action {
            padding: 8px 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: none;
            transition: 0.2s;
        }

        .btn-wa { background: rgba(37, 211, 102, 0.15); color: var(--wa-green); border: 1px solid var(--wa-green); }
        .btn-wa:hover { background: var(--wa-green); color: #fff; }

        .btn-edit { background: rgba(255, 255, 255, 0.05); color: #fff; border: 1px solid var(--border-color); }
        .btn-edit:hover { border-color: var(--accent-gold); color: var(--accent-gold); }

        .btn-delete { background: rgba(239, 68, 68, 0.1); color: var(--danger-red); border: 1px solid var(--danger-red); }
        .btn-delete:hover { background: var(--danger-red); color: #fff; }

        /* MODALE DI MODIFICA */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            align-items: center; justify-content: center;
            padding: 20px;
            z-index: 100;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            max-width: 450px;
            width: 100%;
        }

        .modal-header {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            color: var(--accent-gold);
            margin-bottom: 20px;
        }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.8rem; color: var(--accent-gold); margin-bottom: 6px; text-transform: uppercase; }
        .form-control {
            width: 100%; padding: 12px; background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-color); border-radius: 8px; color: #fff;
        }
        select.form-control option { background: var(--card-bg); }

        .modal-footer { display: flex; gap: 10px; margin-top: 20px; }
        .btn-save { background: var(--accent-gold); color: #000; flex: 1; padding: 12px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; }
        .btn-close { background: transparent; color: var(--text-muted); border: 1px solid var(--border-color); padding: 12px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header-container">
        <div>
            <h1 class="brand-title">AURASS STAFF</h1>
            <p style="color: var(--text-muted); font-size: 0.85rem;">Gestione Prenotazioni Salone</p>
        </div>
        <a href="/admin/logout" class="btn-logout">Esci</a>
    </div>

    <div class="dashboard-container">
        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>Cliente</th>
                        <th>Telefono</th>
                        <th>Servizio</th>
                        <th>Data & Ora</th>
                        <th>Azioni</th>
                    </tr>
                </thead>
                <tbody id="lista-prenotazioni">
                    <tr>
                        <td colspan="5" style="text-align: center; color: var(--text-muted); padding: 30px;">Caricamento appuntamenti in corso...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- MODALE PER LA MODIFICA -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3 class="modal-header">Modifica Appuntamento</h3>
            <form action="/admin/prenotazioni/update" method="POST">
                <input type="hidden" id="edit-id" name="id">
                
                <div class="form-group">
                    <label for="edit-nome">Nome Cliente</label>
                    <input type="text" id="edit-nome" name="nome" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="edit-telefono">Telefono</label>
                    <input type="tel" id="edit-telefono" name="telefono" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="edit-servizio">Servizio</label>
                    <select id="edit-servizio" name="servizio" class="form-control" required>
                        <option value="Taglio Corto / Barber">Taglio Style / Barber</option>
                        <option value="Taglio + Barba">Taglio + Barba Combo</option>
                        <option value="Barba Ritual">Ritual Barba & Panno Caldo</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="edit-data">Data e Ora</label>
                    <input type="datetime-local" id="edit-data" name="data" class="form-control" required>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn-close" onclick="closeModal()">Annulla</button>
                    <button type="submit" class="btn-save">Salva Modifiche</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Caricamento prenotazioni via API
        async function loadPrenotazioni() {
            try {
                const res = await fetch('/api/admin/prenotazioni');
                const data = await res.json();
                
                const tbody = document.getElementById('lista-prenotazioni');
                tbody.innerHTML = '';

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 30px;">Nessuna prenotazione trovata.</td></tr>';
                    return;
                }

                data.forEach(p => {
                    const dataFormattata = new Date(p.data).toLocaleString('it-IT', {
                        day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
                    });

                    // Pulizia numero per link WhatsApp
                    const cleanPhone = p.telefono.replace(/\s+/g, '').replace('+', '');
                    const waText = encodeURIComponent(`Ciao ${p.nome}, ti contattiamo da Aurass in merito alla tua prenotazione per il giorno ${dataFormattata}.`);

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="font-weight: 600;">${p.nome}</td>
                        <td>${p.telefono}</td>
                        <td><span class="badge-service">${p.servizio}</span></td>
                        <td style="color: var(--accent-gold); font-weight: 600;">${dataFormattata}</td>
                        <td>
                            <div class="action-btns">
                                <a href="https://wa.me/${cleanPhone}?text=${waText}" target="_blank" class="btn-action btn-wa" title="Contatta su WhatsApp">💬 WA</a>
                                <button class="btn-action btn-edit" onclick='openModal(${JSON.stringify(p)})'>✏️ Modifica</button>
                                <form action="/admin/prenotazioni/delete" method="POST" style="display:inline;" onsubmit="return confirm('Sicuro di voler cancellare questa prenotazione?');">
                                    <input type="hidden" name="id" value="${p.id}">
                                    <button type="submit" class="btn-action btn-delete">🗑️ Eliminazione</button>
                                </form>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error("Errore caricamento:", err);
            }
        }

        function openModal(prenotazione) {
            document.getElementById('edit-id').value = prenotazione.id;
            document.getElementById('edit-nome').value = prenotazione.nome;
            document.getElementById('edit-telefono').value = prenotazione.telefono;
            document.getElementById('edit-servizio').value = prenotazione.servizio;
            document.getElementById('edit-data').value = prenotazione.data;
            document.getElementById('editModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        loadPrenotazioni();
    </script>
</body>
</html>
